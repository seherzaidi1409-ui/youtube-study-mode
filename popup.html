<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube Study Mode</title>

  <style>
    body {
      width: 260px;
      padding: 20px;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #666666;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .off {
      background: #555555;
    }

    .on {
      background: #2e7d32;
    }

    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 12px;
      color: #666666;
    }
  </style>
</head>

<body>

  <div class="title">🎓 YouTube Study Mode</div>

  <div class="subtitle">
    Stay focused on the content you came to learn.
  </div>

  <button id="toggle">Loading...</button>

  <div id="status"></div>

  <script src="popup.js"></script>

</body>
</html>
